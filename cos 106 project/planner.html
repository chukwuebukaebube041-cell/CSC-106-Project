<div class="container">
<h2>Study Planner</h2>
<div class="input-area">
<input type="text" id="taskText" placeholder="Enter task">
<button onclick="addTask()">Add</button>
</div>
<div id="taskList"></div>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
function saveTasks(){
    localStorage.setItem("tasks", JSON.stringify(tasks));
}
function addTask(){
    const input=document.getElementById("taskText");
    if(input.value.trim()==""){
        alert("Enter a task");
        return;
    }
    tasks.push({
        id:Date.now(),
        text:input.value
    });
    input.value="";
    saveTasks();
    displayTasks();
}
function deleteTask(id){
    tasks=tasks.filter(task=>task.id!==id);
    saveTasks();
    displayTasks();
}
function displayTasks(){
    const taskList=document.getElementById("taskList");
    taskList.innerHTML="";
    tasks.forEach(task=>{
        taskList.innerHTML+=`
        <div class="task">
            <span>${task.text}</span>
            <button onclick="deleteTask(${task.id})">Delete</button>
        </div>
        `;
    });
}
displayTasks();
</script>
